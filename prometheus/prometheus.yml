global:
  scrape_interval: 15s
  evaluation_interval: 15s
alerting:
  alertmanagers:
    - static_configs:
      - targets: ["localhost:9095"]

rule_files:
  - "rules.yml"
scrape_configs:
  - job_name: "kafka"
    static_configs:
      - targets: ["localhost:9101", "localhost:9102", "localhost:9103"]
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
